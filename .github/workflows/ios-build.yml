
name: Meta Camera iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Build CameraAccess
        run: |
          xcodebuild \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: CameraAccess-unsigned
          path: build/Build/Products/Debug-iphoneos/CameraAccess.app
          if-no-files-found: error
